services:
  - type: web
    name: campus-knowledge-agent
    env: python
    plan: free
    pythonVersion: "3.11.9"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_NAME
        value: campus_knowledge_db
      - key: SIMILARITY_THRESHOLD
        value: "0.35"
      - key: APP_ENV
        value: production
      - key: STUDENT_USERNAME
        value: student
      - key: ADMIN_USERNAME
        value: admin
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: STUDENT_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
